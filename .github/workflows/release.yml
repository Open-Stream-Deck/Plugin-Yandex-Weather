name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  OPENSD_VERSION: 1.2.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          version=$(grep -m1 '^version = ' opensd.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match opensd.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install opensd
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Open-Stream-Deck/Open-Stream-Deck-SDK/v$OPENSD_VERSION/install.sh" | sh
          echo "$HOME/.opensd/bin" >> "$GITHUB_PATH"

      - name: Pack
        run: opensd pack

      - name: Notes
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section ## ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.opensd \
            --title "Яндекс Погода ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            --verify-tag
